name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # GitHub-hosted runners ship with Docker, so the Testcontainers-based
      # integration and concurrency tests run unmodified.
      - name: Run tests
        run: ./mvnw -B test
